# Air configuration - ignore TOML linter errors as this is a custom format
# toml-lint: disable-all

[build]
  pre_cmd = "swag init; powershell -Command \"Expand-Archive -Path swagger-ui.zip -DestinationPath .\\static\\swagger -Force; \
  $f=Join-Path $PWD 'static/swagger/swagger-initializer.js'; \
  if (Test-Path $f) { (Get-Content $f) -replace 'url: .*,', 'url: \"/docs/swagger.json\",' | Set-Content $f -Encoding UTF8 }\""
  cmd = "go build -o ./tmp/main.exe ."
  bin = "./tmp/main.exe"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_root = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true